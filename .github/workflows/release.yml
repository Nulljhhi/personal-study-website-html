# Builds Study Website for Linux, Windows, and macOS and attaches the
# downloads to a GitHub Release.
#
# To publish a new version:
#   1. Bump "version" in src-tauri/tauri.conf.json and src-tauri/Cargo.toml
#      (e.g. 1.0.0 -> 1.1.0); the checks below fail if they differ
#   2. git commit -am "Release v1.1.0"
#   3. git tag v1.1.0 && git push && git push --tags
# The builds take roughly 10-20 minutes; watch them in the Actions tab.
#
# The release is made as a draft first and only made public once every
# platform has built, so nobody sees a release with downloads missing. If a
# build fails, the draft stays hidden (delete it under Releases, fix the
# problem, and run the workflow again).

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # Everything below must pass before anything is built or published.
  checks:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Versions agree (tag, tauri.conf.json, Cargo.toml)
        run: |
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/version *= *"(.*)"/\1/')
          server=$(grep -m1 '^version' server/Cargo.toml | sed -E 's/version *= *"(.*)"/\1/')
          echo "tauri.conf.json: $conf  Cargo.toml: $cargo  server/Cargo.toml: $server  ref: $GITHUB_REF_NAME"
          [ "$conf" = "$cargo" ] || { echo "::error::tauri.conf.json and Cargo.toml versions differ"; exit 1; }
          [ "$conf" = "$server" ] || { echo "::error::server/Cargo.toml has a different version"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$conf" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version v$conf"; exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: "22.22.2"

      - name: src/index.html matches the sources in app/
        run: node tools/build.js --check

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Server tests
        working-directory: server
        run: cargo test --locked

      - name: Install test dependencies
        working-directory: tests
        run: npm ci --no-audit --no-fund

      - name: Script checks
        run: node tools/check-scripts.js

      - name: Frontend tests (Playwright + Chromium, and the core in plain Node)
        working-directory: tests
        run: |
          npx playwright install --with-deps chromium
          npm test

  # A hidden draft release that the builds upload into.
  create-release:
    needs: checks
    # Only a pushed version tag publishes. A manual run (Actions tab) runs
    # the checks and stops here, so it can't make a release from a branch.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.result }}
    steps:
      - uses: actions/checkout@v5

      - id: draft
        uses: actions/github-script@v8
        with:
          script: |
            const { version } = require(`${process.env.GITHUB_WORKSPACE}/src-tauri/tauri.conf.json`);
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${version}`,
              target_commitish: context.sha,
              name: `Study Website v${version}`,
              body: [
                "**Which file do I download?**",
                "- **Windows:** the `.exe` installer (`..._x64-setup.exe`)",
                "- **Mac with Apple chip (M1 or newer):** the `aarch64.dmg`",
                "- **Older Intel Mac:** the `x64.dmg`",
                "- **Linux:** the `.AppImage` (any distro) or the `.deb` (Ubuntu/Debian)",
                "- **Windows web server:** `study-server-x64.exe` (most PCs), `study-server-arm64.exe` (Snapdragon / Windows on ARM) or `study-server-x86.exe` (32-bit Windows) serves the app as a web page to this PC and your Tailscale devices only (see the README)",
                "",
                "The first time you open it you'll see a security warning because the app isn't code-signed. See the README for the one-time fix for your system.",
              ].join("\n"),
              draft: true,
              prerelease: false,
            });
            return data.id;

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: "--bundles appimage,deb"
          - platform: windows-latest
            args: "--bundles nsis"
          - platform: macos-latest
            args: "--target aarch64-apple-darwin --bundles dmg"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin --bundles dmg"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22.22.2"

      # Pinned Rust version (also used by the checks job).
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      # The checks job ran these on Linux; this runs them on each system the
      # app is built for, before anything is uploaded.
      - name: Rust tests on this system
        working-directory: src-tauri
        run: cargo test --locked

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  # The Windows web server (server/), one exe per kind of PC, attached to
  # the same draft release.
  build-server:
    needs: create-release
    runs-on: windows-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
          - arch: x86
            target: i686-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Build study-server-${{ matrix.arch }}.exe
        working-directory: server
        shell: bash
        run: |
          cargo test --locked
          cargo build --release --locked --target ${{ matrix.target }}

      - uses: actions/github-script@v8
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const fs = require("fs");
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
              name: "study-server-${{ matrix.arch }}.exe",
              data: fs.readFileSync("server/target/${{ matrix.target }}/release/study-server.exe"),
              headers: { "content-type": "application/octet-stream" },
            });

  # Runs only when every build above succeeded.
  publish-release:
    needs: [create-release, build, build-server]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/github-script@v8
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false,
            });
