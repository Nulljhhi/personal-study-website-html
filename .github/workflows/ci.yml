# Checks every push and pull request: the built page matches its sources,
# the scripts pass their checks, the tests pass in Chromium (and, for
# information, in WebKit), and the Rust tests pass on Linux, Windows and
# macOS. Releases run the same checks again (release.yml).

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Read-only: CI never writes to the repository.
permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22.22.2"

      - name: src/index.html matches the sources in app/
        run: node tools/build.js --check

      - name: Install test dependencies
        working-directory: tests
        run: npm ci --no-audit --no-fund

      - name: Script checks (shared scope, standalone core and zip worker)
        run: node tools/check-scripts.js

      - name: Tests (Playwright + Chromium, and the core in plain Node)
        working-directory: tests
        run: |
          npx playwright install --with-deps chromium
          npm test

  # WebKit is the engine closest to the desktop app on Linux and macOS.
  # Not required yet: it reports differences without blocking a merge.
  webkit:
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22.22.2"

      - name: Tests in WebKit
        working-directory: tests
        env:
          PW_BROWSER: webkit
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps webkit
          npm test

  rust:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # Saving, renaming, recovery and the picture store, against real
      # folders on each system (file locking and sync differ on Windows).
      # Failures are also printed as annotations, which can be read
      # without the full log.
      - name: Rust tests
        working-directory: src-tauri
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked 2>&1 | tee test.log || {
            status=$?
            grep -E "panicked at|^test .* FAILED|^error|left:|right:|^  [a-z].*:" test.log | head -30 | sed 's/^/::error::/'
            exit $status
          }

  # The Windows/Tailscale web server (server/): its tests on Linux and
  # Windows, and the Windows exe for each kind of PC (x64, ARM64, 32-bit)
  # as downloadable artifacts of every run.
  server-tests:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./server -> target"

      - name: Server tests
        working-directory: server
        run: cargo test --locked

  server-exe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
          - arch: x86
            target: i686-pc-windows-msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Build study-server-${{ matrix.arch }}.exe
        working-directory: server
        shell: bash
        run: |
          cargo build --release --locked --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/study-server.exe study-server-${{ matrix.arch }}.exe

      - uses: actions/upload-artifact@v4
        with:
          name: study-server-${{ matrix.arch }}
          path: server/study-server-${{ matrix.arch }}.exe
